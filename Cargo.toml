[package]
name = "gaze"
version = "0.1.3"
edition = "2024"
description = "An expressive xeyes-style cursor watcher"
license = "MIT"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
tray-icon = { version = "0.24.2", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
